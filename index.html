<style>
  :root{--ouro:#EDCF86;--ouro2:#F7C260;--u:0.5px}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#1c0005}
  body{background:#1c0005;color:var(--ouro);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  body.intro{overflow:hidden;height:100vh}
  .pagina{position:relative;width:min(100vw,540px);margin:0 auto;aspect-ratio:1080/5578;background:#2a0008 url(img/fundo.jpg) top center/100% auto no-repeat;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .el{position:absolute;display:block;height:auto}
  .el img{display:block;width:100%;height:auto}
  img.el{pointer-events:none;user-select:none}

  /* ---------- véu da abertura ---------- */
  #veu{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 45%,#3a0410 0%,#1c0005 70%);transition:opacity 1.1s ease;pointer-events:none}
  #veu.some{opacity:0}

  /* ---------- logo ---------- */
  #logo{position:absolute;z-index:50;transform-origin:0 0;will-change:transform}
  #logo svg{display:block;width:100%;height:auto;overflow:visible}
  #logo.voa{transition:transform 1.3s cubic-bezier(.65,0,.25,1)}
  .folha{fill:none;stroke:#E9B85E;stroke-width:2;stroke-linejoin:round}
  .balanca{filter:drop-shadow(0 5px 6px rgba(0,0,0,.45))}
  #brilho-bal{transform:translateX(-260px)}
  #logo.brilha #brilho-bal{animation:varre 1.1s cubic-bezier(.5,0,.3,1) forwards}
  @keyframes varre{to{transform:translateX(760px)}}
  #logo.halo svg{animation:halo 2.4s ease-out}
  @keyframes halo{0%{filter:drop-shadow(0 0 0 rgba(247,194,96,0))}35%{filter:drop-shadow(0 0 18px rgba(247,194,96,.55))}100%{filter:drop-shadow(0 0 0 rgba(247,194,96,0))}}

  /* ---------- entradas (cada efeito começa escondido e anima com .on) ---------- */
  .fx-wipe,.fx-escrita{-webkit-mask-image:linear-gradient(90deg,#000 44%,transparent 56%);mask-image:linear-gradient(90deg,#000 44%,transparent 56%);-webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  .fx-wipe.on{animation:wipe 1.7s cubic-bezier(.45,0,.25,1) var(--d) forwards}
  .fx-escrita.on{animation:wipe 2.3s cubic-bezier(.5,0,.35,1) var(--d) forwards}
  @keyframes wipe{to{-webkit-mask-position:0 0;mask-position:0 0}}
  .faisca{position:absolute;left:0;top:52%;width:calc(var(--u)*26);height:calc(var(--u)*26);margin:calc(var(--u)*-13);border-radius:50%;background:radial-gradient(circle,#fff6d8 0%,rgba(247,194,96,.9) 30%,rgba(247,194,96,0) 70%);opacity:0;pointer-events:none}
  .fx-escrita.on .faisca{animation:faisca 2.3s cubic-bezier(.5,0,.35,1) var(--d) forwards}
  @keyframes faisca{0%{left:0;top:55%;opacity:0}8%{opacity:1}30%{top:35%}55%{top:62%}80%{top:40%;opacity:1}100%{left:100%;top:50%;opacity:0}}

  .fx-blur,.fx-nome{opacity:0;filter:blur(10px);transform:translateY(calc(var(--u)*22))}
  .fx-blur.on,.fx-nome.on{animation:blurin 1.3s cubic-bezier(.2,.7,.2,1) var(--d) forwards}
  @keyframes blurin{to{opacity:1;filter:blur(0);transform:none}}
  .fx-ponto{opacity:0;transform:scale(0)}
  .fx-ponto.on{animation:ponto .7s cubic-bezier(.3,1.6,.5,1) calc(var(--d) + 250ms) forwards}
  @keyframes ponto{to{opacity:1;transform:none}}

  .fx-spread{opacity:0;transform:scaleX(1.35);filter:blur(7px)}
  .fx-spread.on{animation:spread 1.6s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
  @keyframes spread{to{opacity:1;transform:none;filter:blur(0)}}

  .fx-linha{opacity:0;transform:scaleX(0)}
  .fx-linha.on{animation:linha 1.4s cubic-bezier(.7,0,.2,1) var(--d) forwards}
  @keyframes linha{to{opacity:1;transform:none}}
  .fx-desce{opacity:0;transform:translateY(calc(var(--u)*-26));filter:blur(6px)}
  .fx-sobe{opacity:0;transform:translateY(calc(var(--u)*26));filter:blur(6px)}
  .fx-esq{opacity:0;transform:translateX(calc(var(--u)*-40));filter:blur(6px)}
  .fx-dir{opacity:0;transform:translateX(calc(var(--u)*40));filter:blur(6px)}
  .fx-desce.on,.fx-sobe.on,.fx-esq.on,.fx-dir.on{animation:blurin 1.2s cubic-bezier(.2,.7,.2,1) var(--d) forwards}
  .fx-trinta{opacity:0;transform:scale(1.7);filter:blur(14px)}
  .fx-trinta.on{animation:trinta 1.5s cubic-bezier(.2,.8,.2,1) var(--d) forwards,brilho30 2.2s ease-out calc(var(--d) + 1.2s)}
  @keyframes trinta{to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes brilho30{0%,100%{filter:drop-shadow(0 0 0 rgba(247,194,96,0))}40%{filter:drop-shadow(0 0 calc(var(--u)*22) rgba(247,194,96,.75))}}

  /* ---------- dama da justiça + tecido ---------- */
  .aura{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,rgba(247,194,96,.22) 0%,rgba(247,194,96,.07) 40%,rgba(247,194,96,0) 68%);opacity:0;transition:opacity 2.4s ease .5s}
  .aura.on{opacity:1}
  .dama{opacity:0;transform:translateY(16%);filter:brightness(.4)}
  .dama.on{animation:dama 2.2s cubic-bezier(.2,.75,.2,1) var(--d) forwards}
  @keyframes dama{to{opacity:1;transform:none;filter:brightness(1)}}
  .dama>img{display:block;width:100%;height:auto}
  .dama .prato{position:absolute;inset:0;width:100%;will-change:transform}
  #prato-esq{transform-origin:11.36% 20.95%}
  #prato-dir{transform-origin:39.68% 19.50%}
  .fx-tecido{opacity:0;transform:translateX(-70%) skewX(-10deg);filter:blur(4px)}
  .fx-tecido.on{animation:tecido 2s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
  .fx-tecido.on img{animation:ondula 7s ease-in-out 2s infinite}
  @keyframes tecido{to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes ondula{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(calc(var(--u)*-7)) scaleY(1.025)}}

  /* ---------- contagem ---------- */
  .contagem{position:absolute;left:0;width:100%;text-align:center}
  .contagem .titulo{font-family:"Cinzel",serif;font-weight:400;font-size:calc(var(--u)*40);letter-spacing:.32em;padding-left:.32em;color:var(--ouro);opacity:0;filter:blur(8px)}
  .contagem.on .titulo{animation:blurin 1.3s ease forwards}
  .contagem .sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;font-size:calc(var(--u)*40);color:#fff4dc;margin-top:calc(var(--u)*6);opacity:0}
  .contagem.on .sub{animation:blurin 1.3s ease .3s forwards}
  .relogio{display:flex;justify-content:center;align-items:stretch;gap:calc(var(--u)*14);margin-top:calc(var(--u)*46)}
  .uni{width:calc(var(--u)*176);padding:calc(var(--u)*22) 0 calc(var(--u)*18);position:relative;opacity:0;transform:translateY(calc(var(--u)*30))}
  .uni::before,.uni::after{content:"";position:absolute;left:0;right:0;height:calc(var(--u)*2.2);background:linear-gradient(90deg,rgba(237,207,134,0),var(--ouro) 20%,var(--ouro) 80%,rgba(237,207,134,0));transform:scaleX(0)}
  .uni::before{top:0}.uni::after{bottom:0}
  .contagem.on .uni{animation:blurin 1.1s cubic-bezier(.2,.7,.2,1) calc(.5s + var(--i)*.15s) forwards}
  .contagem.on .uni::before,.contagem.on .uni::after{animation:linha 1.2s cubic-bezier(.7,0,.2,1) calc(.7s + var(--i)*.15s) forwards}
  .uni b{display:block;font-family:"Cormorant Garamond",serif;font-weight:300;font-size:calc(var(--u)*116);line-height:1;color:var(--ouro);font-variant-numeric:lining-nums tabular-nums}
  .uni small{display:block;margin-top:calc(var(--u)*12);font-family:"Cinzel",serif;font-size:calc(var(--u)*24);letter-spacing:.22em;padding-left:.22em;color:#fff4dc}
  .chegou{display:none;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:calc(var(--u)*70);margin-top:calc(var(--u)*30)}

  /* ---------- ícones ---------- */
  .icone{z-index:3;border:0;background:none;padding:0;cursor:pointer;opacity:0;transform:scale(.4) rotate(-25deg);border-radius:50%}
  .icone.on{animation:pop 1s cubic-bezier(.25,1.5,.45,1) var(--d) forwards}
  @keyframes pop{to{opacity:1;transform:none}}
  .icone .reflexo{position:absolute;inset:8%;border-radius:50%;overflow:hidden;pointer-events:none}
  .icone .reflexo::before{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,250,225,.55),rgba(255,255,255,0));transform:skewX(-18deg)}
  .icone.on .reflexo::before{animation:reflexo 4.5s ease-in-out calc(var(--d) + 1.2s) infinite}
  @keyframes reflexo{0%{left:-60%}28%,100%{left:130%}}
  .icone::after{content:"";position:absolute;inset:8%;border-radius:50%;pointer-events:none}
  .icone.on::after{animation:pulso 2.6s ease-in-out calc(var(--d) + 1s) infinite}
  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(247,194,96,0)}50%{box-shadow:0 0 calc(var(--u)*34) calc(var(--u)*6) rgba(247,194,96,.32)}}
  .icone:focus-visible{outline:2px solid var(--ouro);outline-offset:4px}

  /* ---------- poeira dourada ---------- */
  #poeira{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

  /* ---------- confirmação (Forms dentro do convite) ---------- */
  #rsvp{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(15,0,3,.82);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .4s ease}
  #rsvp.aberto{opacity:1;pointer-events:auto}
  #rsvp .janela{position:relative;width:min(94vw,calc(92vh * 9 / 16));aspect-ratio:9/16;max-height:92vh;background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(237,207,134,.6);box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #rsvp iframe{width:100%;height:100%;border:0;display:block}
  #rsvp .fechar{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(168,120,40,.5);background:#2a0008;color:var(--ouro);font:400 22px/1 "Cinzel",serif;cursor:pointer;z-index:2}
  #rsvp .aviso{display:flex;align-items:center;justify-content:center;height:100%;padding:30px;text-align:center;font:400 20px "Cormorant Garamond",serif;color:#2a0008}

  @media (prefers-reduced-motion: reduce){
    .fx-wipe,.fx-escrita{-webkit-mask-position:0 0!important;mask-position:0 0!important}
    [class*="fx-"],.dama,.icone,.uni,.contagem .titulo,.contagem .sub{opacity:1!important;transform:none!important;filter:none!important;animation:none!important}
    .uni::before,.uni::after{transform:none!important}
    #poeira{display:none}
  }
</style>
</head>

        var x=(p.x+Math.sin(p.f)*.012)*cv.width, y=p.y*cv.height, r=p.r*dpr, al=p.a*(.6+.4*Math.sin(p.f*1.7));
        var g=cx.createRadialGradient(x,y,0,x,y,r*3); g.addColorStop(0,'rgba(255,226,150,'+al+')'); g.addColorStop(1,'rgba(255,226,150,0)');
        cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,r*3,0,6.283); cx.fill(); });
      requestAnimationFrame(voa);
    })();
  }

  /* ===== CONFIRMAÇÃO DE PRESENÇA (abre dentro do convite) ===== */
  var rsvp=document.getElementById('rsvp'), cont=rsvp.querySelector('.conteudo');
  document.getElementById('abrir-rsvp').addEventListener('click',function(){
    if(!cont.firstChild){ cont.style.height='100%';
      cont.innerHTML=FORMS_URL?'<iframe src="'+FORMS_URL+(FORMS_URL.indexOf('?')<0?'?':'&')+'embedded=true" title="Confirmar presença" loading="lazy"></iframe>':'<div class="aviso">A confirmação de presença estará disponível em breve.</div>'; }
    rsvp.classList.add('aberto'); document.body.style.overflow='hidden';
  });
  function fechar(){ rsvp.classList.remove('aberto'); document.body.style.overflow=''; }
  rsvp.querySelector('.fechar').addEventListener('click',fechar);
  rsvp.addEventListener('click',function(e){ if(e.target===rsvp) fechar(); });
  addEventListener('keydown',function(e){ if(e.key==='Escape') fechar(); });

  /* começa quando a página e as fontes estiverem prontas */
  var foi=false; function vai(){ if(foi)return; foi=true; unidade(); abertura(); }
  if(document.readyState==='complete') setTimeout(vai,150); else addEventListener('load',function(){ setTimeout(vai,150); });
  setTimeout(vai,3500);
})();
</script>
</body>
</html>
